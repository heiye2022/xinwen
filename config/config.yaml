# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
# ═══════════════════════════════════════════════════════════════


# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"
  show_version_update: true


# ===============================================================
# 2. 数据源 - 热榜平台
# ===============================================================
platforms:
  # 🔥 核心流量平台
  - id: "weibo"
    name: "微博热搜"
  - id: "zhihu"
    name: "知乎热榜"
  - id: "douyin"
    name: "抖音热榜"
  - id: "xiaohongshu-hot"     # ✅ 正确的小红书热榜ID
    name: "小红书热榜"
  - id: "bilibili-hot-search"
    name: "B站热搜"

  # 📊 搜索与资讯平台
  - id: "baidu"
    name: "百度热搜"
  - id: "toutiao"
    name: "今日头条"

  # 💼 财经与专业视角
  - id: "wallstreetcn-hot"
    name: "华尔街见闻"
  - id: "cls-hot"
    name: "财联社热门"
  - id: "thepaper"
    name: "澎湃新闻"

  # 🗣️ 社区与长尾讨论
  - id: "tieba"
    name: "贴吧"
  - id: "ifeng"
    name: "凤凰网"

# ===============================================================
# 3. 数据源 - RSS 订阅（聚焦变现、AI、趋势）
# ===============================================================
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 2

  feeds:
    - id: "ruanyifeng"
      name: "阮一峰的网络日志"
      url: "http://www.ruanyifeng.com/blog/atom.xml"

    - id: "xugj_blog"
      name: "高效码农"
      url: "https://www.xugj520.cn/feed"

    - id: "linuxdo"
      name: "Linux.do"
      url: "https://linux.do/latest.rss"

    # 使用 RSSHub 代理获取蜗牛教授博客（若部署环境可访问 rsshub.app）
    - id: "woniu_blog"
      name: "蜗牛教授"
      url: "https://rsshub.app/wordpress/www.woniu996.com"

    # 国际AI商业动态（高价值）
    - id: "bens_bites"
      name: "Ben's Bites"
      url: "https://bensbites.beehiiv.com/feed"



# ===============================================================
# 4. 报告模式
# ===============================================================
report:
  mode: "current"
  display_mode: "keyword"
  rank_threshold: 5
  sort_by_position_first: false
  max_news_per_keyword: 0
  reverse_content_order: false


# ===============================================================
# 5. 推送通知
# ===============================================================
notification:
  enabled: true
  push_window:
    enabled: false
    start: "20:00"
    end: "22:00"
    once_per_day: true
  standalone_display:
    enabled: false
    platforms: []
    rss_feeds: []
    max_items: 20
  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""


# ===============================================================
# 6. 存储配置
# ===============================================================
storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  pull:
    enabled: false
    days: 7


# ===============================================================
# 7. AI 分析功能（✅ 已正确配置 Moonshot / Kimi）
# ===============================================================

ai_analysis:
  enabled: true
  provider: "deepseek"          # ← 直接写死，不要用 ${}
  api_key: "${AI_API_KEY}"      # 这个可以保留（如果 workflow 注入 env）
  model: "deepseek-chat"
  timeout: 90
  push_mode: "both"

  max_news_for_analysis: 50
  include_rss: false
  prompt_file: "ai_analysis_prompt.txt"
  



 


# ===============================================================
# 8. 高级设置
# ===============================================================
advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  crawler:
    enabled: true
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""
    notification_enabled: true
  weight:
    rank: 0.4
    frequency: 0.5
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━"
